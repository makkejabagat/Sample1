            VerticalAlign: =VerticalAlign.Middle
      - Label_HdrAuditedBy:
          Control: Label@2.5.1
          Properties:
            Text: ="Audited By"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Size: =12
            FontWeight: =FontWeight.Bold
            FillPortions: =2
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
      - Label_HdrScore:
          Control: Label@2.5.1
          Properties:
            Text: ="Score"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Size: =12
            FontWeight: =FontWeight.Bold
            FillPortions: =1
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
  - Gallery_DBAudit:
      Control: Gallery@2.15.0
      Properties:
        X: =16
        Y: =380
        Width: =Parent.Width - 32
        Height: =Parent.Height - 430
        Items: =Sort(Filter('QA Compilation - Entries', (IsBlank(TextInput_DBSearch.Text) || TextInput_DBSearch.Text in 'Agent''s Full Name'.DisplayName || TextInput_DBSearch.Text in 'Agent Contact ID/ Master Contact ID/ MRN'), (Dropdown_DBForm.Selected.Value = "All Forms" || 'Audit Form' = Dropdown_DBForm.Selected.Value), (Dropdown_DBMarket.Selected.Value = "All Markets" || Market = Dropdown_DBMarket.Selected.Value), (IsBlank(DatePicker_DBStart.SelectedDate) || Created >= DatePicker_DBStart.SelectedDate), (IsBlank(DatePicker_DBEnd.SelectedDate) || Created < DateAdd(DatePicker_DBEnd.SelectedDate, 1, TimeUnit.Days))), Value(Substitute(Score, "%", "")), If(varDB_SortAsc, SortOrder.Ascending, SortOrder.Descending))
        TemplateSize: =52
        TemplatePadding: =0
        ShowScrollbar: =true
        BorderColor: =RGBA(220, 220, 220, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
      Children:
      - Rectangle_DBRowBG:
          Control: Rectangle@1.0.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight
            Fill: =If(IsEven(ThisItem.ItemNumber), RGBA(245, 248, 252, 1), RGBA(255, 255, 255, 1))
            BorderColor: =RGBA(230, 230, 230, 1)
            BorderThickness: =1
      - Container_DBRow:
          Control: GroupContainer@1.5.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Horizontal
            AlignInContainer: =AlignInContainer.Center
            PaddingLeft: =10
            PaddingRight: =10
          Children:
          - Label_DBRowName:
              Control: Label@2.5.1
              Properties:
                Text: =ThisItem.'Agent''s Full Name'.DisplayName
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =3
                Align: =Align.Left
                VerticalAlign: =VerticalAlign.Middle
                Overflow: =Overflow.Hidden
          - Label_DBRowForm:
              Control: Label@2.5.1
              Properties:
                Text: =ThisItem.'Audit Form'
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
          - Label_DBRowMarket:
              Control: Label@2.5.1
              Properties:
                Text: =ThisItem.Market
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
          - Label_DBRowAuditID:
              Control: Label@2.5.1
              Properties:
                Text: =ThisItem.'Audit ID'
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
          - Label_DBRowAuditDate:
              Control: Label@2.5.1
              Properties:
                Text: =Text(ThisItem.Created, "mm/dd/yyyy")
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
          - Label_DBRowCallDate:
              Control: Label@2.5.1
              Properties:
                Text: =Text(ThisItem.'Call Date', "mm/dd/yyyy")
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
          - Label_DBRowAuditedBy:
              Control: Label@2.5.1
              Properties:
                Text: =ThisItem.'Created By'.DisplayName
                Color: =RGBA(30, 30, 30, 1)
                Font: =Font.Lato
                Size: =12
                FillPortions: =2
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
                Overflow: =Overflow.Hidden
          - Container_DBScoreBadge:
              Control: GroupContainer@1.5.0
              Properties:
                FillPortions: =1
                Fill: =RGBA(0, 0, 0, 0)
                LayoutDirection: =LayoutDirection.Horizontal
                AlignInContainer: =AlignInContainer.Center
              Children:
              - Label_DBRowScore:
                  Control: Label@2.5.1
                  Properties:
                    Text: =ThisItem.Score
                    Color: =RGBA(255, 255, 255, 1)
                    Font: =Font.'Lato Black'
                    Size: =12
                    FontWeight: =FontWeight.Bold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Fill: =If(IsBlank(ThisItem.Score), RGBA(200, 200, 200, 1), If(Value(Substitute(ThisItem.Score, "%", "")) >= 95, RGBA(73, 130, 5, 1), RGBA(200, 30, 30, 1)))
                    PaddingLeft: =8
                    PaddingRight: =8
                    PaddingTop: =4
                    PaddingBottom: =4
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    Width: =70
                    Height: =28
  - Container_DBFooter:
      Control: GroupContainer@1.5.0
      Properties:
        X: =16
        Y: =Parent.Height - 42
        Width: =Parent.Width - 32
        Height: =34
        Fill: =RGBA(0, 0, 0, 0)
        LayoutDirection: =LayoutDirection.Horizontal
        AlignInContainer: =AlignInContainer.Center
        Gap: =20
      Children:
      - Label_DBRecordCount:
          Control: Label@2.5.1
          Properties:
            Text: =CountRows(Gallery_DBAudit.AllItems) & " record(s) found"
            Color: =RGBA(100, 100, 100, 1)
            Font: =Font.Lato
            Size: =12
            FillPortions: =1
            Align: =Align.Left
            VerticalAlign: =VerticalAlign.Middle
      - Label_DBPassRate:
          Control: Label@2.5.1
          Properties:
            Text: =If(CountRows(Gallery_DBAudit.AllItems) = 0, "Pass Rate: N/A", "Pass Rate: " & Text(Round(CountIf(Gallery_DBAudit.AllItems, Value(Substitute(Score, "%", "")) >= 95) / CountRows(Gallery_DBAudit.AllItems) * 100, 1), "0.0") & "%")
            Color: =RGBA(100, 100, 100, 1)
            Font: =Font.Lato
            Size: =12
            FillPortions: =1
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle
