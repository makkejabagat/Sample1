                RadiusTopRight: =4
                RadiusBottomLeft: =4
                RadiusBottomRight: =4
      - Container_FilterForm:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =2
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Vertical
            Gap: =4
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_FilterFormLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Audit Form"
                Color: =RGBA(80, 80, 80, 1)
                Font: =Font.Lato
                Size: =11
                Height: =18
                FontWeight: =FontWeight.Semibold
          - Dropdown_DBForm:
              Control: Classic/DropDown@2.3.1
              Properties:
                FillPortions: =1
                Items: =["All Forms","NOA","PRG","FC","SCH","OM","IVA","IDX","RR","CAS"]
                Font: =Font.Lato
                Size: =13
                BorderColor: =RGBA(200, 200, 200, 1)
                ChevronBackground: =RGBA(15, 84, 140, 1)
                ChevronFill: =RGBA(255, 255, 255, 1)
      - Container_FilterMarket:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =2
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Vertical
            Gap: =4
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_FilterMarketLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Market"
                Color: =RGBA(80, 80, 80, 1)
                Font: =Font.Lato
                Size: =11
                Height: =18
                FontWeight: =FontWeight.Semibold
          - Dropdown_DBMarket:
              Control: Classic/DropDown@2.3.1
              Properties:
                FillPortions: =1
                Items: =Distinct(Sort('QA Compilation - Entries', Market, SortOrder.Ascending), Market)
                Font: =Font.Lato
                Size: =13
                BorderColor: =RGBA(200, 200, 200, 1)
                ChevronBackground: =RGBA(15, 84, 140, 1)
                ChevronFill: =RGBA(255, 255, 255, 1)
      - Container_FilterDateStart:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =2
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Vertical
            Gap: =4
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_FilterDateStartLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Date From"
                Color: =RGBA(80, 80, 80, 1)
                Font: =Font.Lato
                Size: =11
                Height: =18
                FontWeight: =FontWeight.Semibold
          - DatePicker_DBStart:
              Control: ModernDatePicker@1.0.0
              Properties:
                FillPortions: =1
                Font: =Font.Lato
                Size: =13
      - Container_FilterDateEnd:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =2
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Vertical
            Gap: =4
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_FilterDateEndLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Date To"
                Color: =RGBA(80, 80, 80, 1)
                Font: =Font.Lato
                Size: =11
                Height: =18
                FontWeight: =FontWeight.Semibold
          - DatePicker_DBEnd:
              Control: ModernDatePicker@1.0.0
              Properties:
                FillPortions: =1
                Font: =Font.Lato
                Size: =13
      - Container_FilterButtons:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =1
            Fill: =RGBA(0, 0, 0, 0)
            LayoutDirection: =LayoutDirection.Vertical
            Gap: =6
            AlignInContainer: =AlignInContainer.Center
          Children:
          - ButtonCanvas_DBSort:
              Control: ButtonCanvas@2.3.0
              Properties:
                Text: =If(varDB_SortAsc, "↑ Score", "↓ Score")
                OnSelect: =Set(varDB_SortAsc, !varDB_SortAsc)
                Fill: =RGBA(15, 84, 140, 1)
                HoverFill: =RGBA(10, 60, 110, 1)
                PressedFill: =RGBA(8, 45, 85, 1)
                Color: =RGBA(255, 255, 255, 1)
                Font: =Font.Lato
                Size: =12
                FontWeight: =FontWeight.Semibold
                BorderRadius: =4
                Height: =34
                ToolTip: ="Toggle sort order"
          - ButtonCanvas_DBReset:
              Control: ButtonCanvas@2.3.0
              Properties:
                Text: ="Reset Filters"
                OnSelect: =Reset(TextInput_DBSearch); Reset(Dropdown_DBForm); Reset(Dropdown_DBMarket); Reset(DatePicker_DBStart); Reset(DatePicker_DBEnd)
                Fill: =RGBA(180, 180, 180, 1)
                HoverFill: =RGBA(150, 150, 150, 1)
                PressedFill: =RGBA(120, 120, 120, 1)
                Color: =RGBA(255, 255, 255, 1)
                Font: =Font.Lato
                Size: =12
                FontWeight: =FontWeight.Semibold
                BorderRadius: =4
                Height: =34
                ToolTip: ="Clear all filters"
  - Container_DBGalleryHeader:
