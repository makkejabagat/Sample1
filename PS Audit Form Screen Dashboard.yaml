            Size: =12
            FontWeight: =FontWeight.Bold
            FillPortions: =3
            Align: =Align.Left
            VerticalAlign: =VerticalAlign.Middle
      - Label_HdrForm:
          Control: Label@2.5.1
          Properties:
            Text: ="Audit Form"
