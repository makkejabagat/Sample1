PS Audit Form Screen Dashboard:
  Properties:
    Fill: =RGBA(240, 244, 248, 1)
    LoadingSpinner: =LoadingSpinner.None
    OnVisible: =Set(varDB_SortAsc, false)
  Children:
  - Rectangle_DBHeader:
      Control: Rectangle@1.0.0
      Properties:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =70
        Fill: =RGBA(15, 84, 140, 1)
  - Label_DBTitle:
      Control: Label@2.5.1
      Properties:
        X: =60
        Y: =0
        Width: =Parent.Width - 220
        Height: =70
        Text: ="AUDIT SCORE DASHBOARD"
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Lato Black'
        Size: =20
        FontWeight: =FontWeight.Bold
        Align: =Align.Left
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =10
  - ButtonCanvas_DBBack:
      Control: ButtonCanvas@2.3.0
      Properties:
        X: =8
        Y: =10
        Width: =46
        Height: =46
        OnSelect: =Navigate('PS Audit Form Screen')
        BorderRadius: =23
        Fill: =RGBA(255, 255, 255, 0.15)
        HoverFill: =RGBA(255, 255, 255, 0.25)
        PressedFill: =RGBA(255, 255, 255, 0.35)
        BorderColor: =RGBA(255, 255, 255, 0.3)
        BorderThickness: =1
        ToolTip: ="Back to Audit Form"
      Children:
      - Icon_DBBackArrow:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(255, 255, 255, 1)
            Width: =30
            Height: =30
            X: =8
            Y: =8
  - Container_DBStats:
      Control: GroupContainer@1.5.0
      Properties:
        X: =16
        Y: =88
        Width: =Parent.Width - 32
        Height: =110
        LayoutDirection: =LayoutDirection.Horizontal
        Gap: =12
        AlignInContainer: =AlignInContainer.Stretch
        FillPortions: =1
        Fill: =RGBA(0, 0, 0, 0)
      Children:
      - Container_StatTotal:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =1
            Fill: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DropShadow: =DropShadow.Light
            LayoutDirection: =LayoutDirection.Vertical
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_StatTotalVal:
              Control: Label@2.5.1
              Properties:
                Text: =Text(CountRows('QA Compilation - Entries'), "0")
                Color: =RGBA(15, 84, 140, 1)
                Font: =Font.'Lato Black'
                Size: =28
                FontWeight: =FontWeight.Bold
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Bottom
                FillPortions: =2
                PaddingTop: =10
          - Label_StatTotalLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Total Audits"
                Color: =RGBA(100, 100, 100, 1)
                Font: =Font.Lato
                Size: =12
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Top
                FillPortions: =1
                PaddingBottom: =10
      - Container_StatAvg:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =1
            Fill: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DropShadow: =DropShadow.Light
            LayoutDirection: =LayoutDirection.Vertical
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_StatAvgVal:
              Control: Label@2.5.1
              Properties:
                Text: =If(CountRows('QA Compilation - Entries') = 0, "N/A", Text(Average(AddColumns('QA Compilation - Entries', "NumScore", Value(Substitute(Score, "%", ""))), NumScore), "0.00") & "%")
                Color: =RGBA(73, 130, 5, 1)
                Font: =Font.'Lato Black'
                Size: =28
                FontWeight: =FontWeight.Bold
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Bottom
                FillPortions: =2
                PaddingTop: =10
          - Label_StatAvgLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Average Score"
                Color: =RGBA(100, 100, 100, 1)
                Font: =Font.Lato
                Size: =12
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Top
                FillPortions: =1
                PaddingBottom: =10
      - Container_StatPass:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =1
            Fill: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DropShadow: =DropShadow.Light
            LayoutDirection: =LayoutDirection.Vertical
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_StatPassVal:
              Control: Label@2.5.1
              Properties:
                Text: =Text(CountIf('QA Compilation - Entries', Value(Substitute(Score, "%", "")) >= 95), "0")
                Color: =RGBA(0, 153, 0, 1)
                Font: =Font.'Lato Black'
                Size: =28
                FontWeight: =FontWeight.Bold
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Bottom
                FillPortions: =2
                PaddingTop: =10
          - Label_StatPassLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Passing (≥95%)"
                Color: =RGBA(100, 100, 100, 1)
                Font: =Font.Lato
                Size: =12
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Top
                FillPortions: =1
                PaddingBottom: =10
      - Container_StatFail:
          Control: GroupContainer@1.5.0
          Properties:
            FillPortions: =1
            Fill: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DropShadow: =DropShadow.Light
            LayoutDirection: =LayoutDirection.Vertical
            AlignInContainer: =AlignInContainer.Stretch
          Children:
          - Label_StatFailVal:
              Control: Label@2.5.1
              Properties:
                Text: =Text(CountIf('QA Compilation - Entries', Value(Substitute(Score, "%", "")) < 95), "0")
                Color: =RGBA(200, 0, 0, 1)
                Font: =Font.'Lato Black'
                Size: =28
                FontWeight: =FontWeight.Bold
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Bottom
                FillPortions: =2
                PaddingTop: =10
          - Label_StatFailLbl:
              Control: Label@2.5.1
              Properties:
                Text: ="Failing (<95%)"
                Color: =RGBA(100, 100, 100, 1)
                Font: =Font.Lato
                Size: =12
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Top
                FillPortions: =1
                PaddingBottom: =10
  - Container_DBFilters:
      Control: GroupContainer@1.5.0
      Properties:
        X: =16
        Y: =214
        Width: =Parent.Width - 32
        Height: =110
        Fill: =RGBA(255, 255, 255, 1)
        RadiusTopLeft: =8
        RadiusTopRight: =8
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        DropShadow: =DropShadow.Light
        LayoutDirection: =LayoutDirection.Horizontal
        Gap: =10
        AlignInContainer: =AlignInContainer.Center
        PaddingLeft: =12
        PaddingRight: =12
        PaddingTop: =12
        PaddingBottom: =12
