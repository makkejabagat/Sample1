            Font: =Font.'Lato Black'
            Size: =12
            FontWeight: =FontWeight.Bold
            FillPortions: =2
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
      - Label_HdrAuditDate:
          Control: Label@2.5.1
          Properties:
            Text: ="Audit Date"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Size: =12
            FontWeight: =FontWeight.Bold
            FillPortions: =2
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
      - Label_HdrCallDate:
          Control: Label@2.5.1
          Properties:
            Text: ="Call Date"
